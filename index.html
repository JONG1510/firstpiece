<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World Timestamp</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Source+Code+Pro&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Lato', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            margin: 0 0 10px 0;
            color: #2c3e50;
        }
        .timestamp {
            font-family: 'Source Code Pro', monospace;
            font-size: 1.1em;
            color: #16a085;
            border-top: 1px solid #eee;
            padding-top: 15px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hello World</h1>
        <div class="timestamp" id="datetime">Loading current time...</div>
    </div>

    <script>
        function updateDateTime() {
            const now = new Date();
            // Formats date nicely according to local settings
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            };
            document.getElementById('datetime').textContent = now.toLocaleDateString('en-US', options);
        }

        // Update instantly, then refresh every second
        updateDateTime();
        setInterval(updateDateTime, 1000);
    </script>

</body>
</html>
