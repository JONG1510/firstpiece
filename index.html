<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to One Piece !!</title>
    <style>
        :root {
            --bg-cream: #fbf9f1;
            --primary-blue: #1e3a8a;
            --secondary-blue: #3b82f6;
            --text-dark: #1f2937;
            --text-muted: #4b5563;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            color: var(--primary-blue);
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.2rem;
            font-weight: 400;
            margin-bottom: 1rem;
        }

        /* Live Clock Container */
        #clock-container {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: rgba(30, 58, 138, 0.08);
            color: var(--primary-blue);
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-top: 0.5rem;
            border: 1px solid rgba(30, 58, 138, 0.15);
        }

        /* Media Container */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            margin: 2rem 0;
        }

        .media-card {
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(30, 58, 138, 0.1), 0 8px 10px -6px rgba(30, 58, 138, 0.1);
            border: 1px solid var(--border-color);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .media-card img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            object-fit: cover;
        }

        .media-caption {
            margin-top: 0.75rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 2rem;
        }

        footer a {
            color: var(--secondary-blue);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1> Welcome to Shangri La Frontier ~ </h1>
        <p class="subtitle">Seeking the ultimate adventure!</p>
        
        <!-- Live Date & Time -->
        <div id="clock-container">
            <span id="live-clock">Loading live time...</span>
        </div>
    </header>

<main class="main-content">
        <div class="media-card">
            <img src="SLF_Sun.png" alt="SLF Media">
            
            <p class="media-caption">"Join the Wolf Pack!" — Arthur Pentagon</p>
            
            <a href="https://app.thestorygraph.com/books/c4d891d0-0760-4cbf-80b7-a466833c60cc" target="_blank" class="photo-link">Visit the Official One Piece Website</a>
        </div>
    </main>

    <footer>
        <p> Welcome to Shangri La Frontier ~ 💙</p>
    </footer>

    <script>
        function updateClock() {
            const now = new Date();
            
            // Format options for local date and time display
            const options = { 
                weekday: 'short', 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric',
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: true 
            };
            
            document.getElementById('live-clock').textContent = now.toLocaleString('en-US', options);
        }

        // Update the clock immediately and then every second
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
